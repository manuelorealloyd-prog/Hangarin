<!DOCTYPE html>
<html>
<head>
    <title>Login - Hangarin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111315;
            color: #ffffff;
        }

        .login-page {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111315;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #1a1d20;
            border: 1px solid #2b2f34;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .login-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .logo-circle {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #3b82f6;
            color: white;
            border-radius: 12px;
            font-size: 21px;
            font-weight: bold;
        }

        .login-logo h2 {
            color: white;
            font-size: 22px;
            margin-bottom: 3px;
        }

        .login-logo span {
            color: #777d85;
            font-size: 12px;
        }

        .login-header {
            margin-bottom: 28px;
        }

        .login-header h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #858b93;
            font-size: 14px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .login-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .login-field label {
            color: #d8dadd;
            font-size: 14px;
            font-weight: bold;
        }

        .login-field input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            background: #111315;
            color: white;
            border: 1px solid #343940;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
        }

        .login-field input:focus {
            border-color: #3b82f6;
        }

        .login-error {
            margin-top: 18px;
            padding: 12px;
            background: #302124;
            border: 1px solid #543237;
            border-radius: 8px;
            color: #ff8b8b;
            font-size: 13px;
        }

        .login-error ul {
            padding-left: 18px;
        }

        .login-button {
            width: 100%;
            height: 46px;
            margin-top: 26px;
            border: none;
            border-radius: 9px;
            background: #3b82f6;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #2563eb;
        }

        .login-footer {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 30px;
            color: #555b63;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="login-logo">

            <div class="logo-circle">
                H
            </div>

            <div>
                <h2>Hangarin</h2>
                <span>Task & To-Do Manager</span>
            </div>

        </div>

        <div class="login-header">
            <h1>Welcome back</h1>
            <p>Sign in to continue managing your tasks.</p>
        </div>

        <form method="post">

            {% csrf_token %}

            <div class="login-form">

                <div class="login-field">
                    <label for="{{ form.username.id_for_label }}">
                        Username
                    </label>

                    {{ form.username }}
                </div>

                <div class="login-field">
                    <label for="{{ form.password.id_for_label }}">
                        Password
                    </label>

                    {{ form.password }}
                </div>

            </div>

            {% if form.non_field_errors %}
                <div class="login-error">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <button type="submit" class="login-button">
                Sign In
            </button>

        </form>

        <div class="login-footer">
            <span>Hangarin</span>
            <span>•</span>
            <span>2026</span>
        </div>

    </div>

</div>

</body>
</html>
